    // Make lucide icons available (lucide-react UMD exposes as window.LucideReact)

    const _lucide = window.LucideReact || window.lucideReact || window.lucide || {};
    const {
      Heart, Shield, Globe, ArrowRight, CheckCircle, Search,
      Activity, User, Building2, Stethoscope, MapPin, X,
      ChevronLeft, ChevronRight, LogOut, PlusCircle, Clipboard, Lock
    } = _lucide;

    // Icon fallback — if lucide fails to load, use emoji text spans
    const _icon = (Icon, fallback, props={}) => {
      try { return Icon ? React.createElement(Icon, props) : React.createElement('span', {style:{fontSize:props.size||16}}, fallback); }
      catch(e) { return React.createElement('span', {style:{fontSize:props.size||16}}, fallback); }
    };

    // Polyfill window.storage with localStorage for production
    window.storage = {
      get: async (key) => {
        const v = localStorage.getItem(key);
        return v ? {key, value: v} : null;
      },
      set: async (key, value) => {
        localStorage.setItem(key, value);
        return {key, value};
      },
      delete: async (key) => {
        localStorage.removeItem(key);
        return {key, deleted: true};
      },
      list: async (prefix) => {
        const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
        return {keys};
      }
    };

    const { useState, useEffect, useCallback } = React;

async function dbGet(key){ try{ const r=await window.storage.get(key); return r?JSON.parse(r.value):null; }catch{ return null; } }
async function dbSet(key,val){ try{ await window.storage.set(key,JSON.stringify(val)); }catch{} }

function genSokaId(cc="NG"){ return `AHII-${cc}-${String(Math.floor(Math.random()*999999+1)).padStart(6,"0")}`; }
function genPayRef(pfx="PAY"){ return `AHII-${pfx}-2026-${String(Math.floor(Math.random()*99999+1)).padStart(5,"0")}`; }

function Badge({status}){
  const m={received:{e:"🟡",l:"Application Received",bg:"#FEF9C3",c:"#92400E"},review:{e:"🔵",l:"Under Review",bg:"#DBEAFE",c:"#1E40AF"},verified:{e:"🟢",l:"AHII Verified",bg:"#DCFCE7",c:"#166534"},self:{e:"⚪",l:"Self-Reported",bg:"#F3F4F6",c:"#374151"}};
  const b=m[status]||m.self;
  return <span style={{background:b.bg,color:b.c,padding:"2px 8px",borderRadius:20,fontSize:11,fontWeight:600,display:"inline-flex",alignItems:"center",gap:4}}>{b.e} {b.l}</span>;
}

function Btn({children,onClick,bg,color,style={},size="md"}){
  const pad=size==="lg"?"14px 28px":size==="sm"?"6px 13px":"10px 20px";
  const fs=size==="lg"?15:size==="sm"?12:14;
  return <button onClick={onClick} style={{background:bg||C.green,border:"none",color:color||"#fff",borderRadius:9,padding:pad,fontSize:fs,fontWeight:700,cursor:"pointer",fontFamily:"inherit",display:"inline-flex",alignItems:"center",gap:6,transition:"opacity .15s",...style}} onMouseEnter={e=>e.currentTarget.style.opacity=".85"} onMouseLeave={e=>e.currentTarget.style.opacity="1"}>{children}</button>;
}

function Field({label,type="text",value,onChange,options,required,hint}){
  const base={width:"100%",padding:"10px 12px",border:`1px solid ${C.greyLight}`,borderRadius:8,fontSize:14,fontFamily:"inherit",color:C.text,boxSizing:"border-box",background:"#fff"};
  return(
    <div>
      <label style={{fontSize:12,fontWeight:600,color:C.navy,display:"block",marginBottom:5}}>{label}{required&&" *"}</label>
      {type==="select"?<select value={value} onChange={e=>onChange(e.target.value)} style={base}><option value="">Select…</option>{options.map(o=><option key={o} value={o}>{o}</option>)}</select>
      :type==="textarea"?<textarea value={value} onChange={e=>onChange(e.target.value)} rows={3} style={{...base,resize:"vertical"}}/>
      :<input type={type} value={value} onChange={e=>onChange(e.target.value)} style={base}/>}
      {hint&&<div style={{fontSize:11,color:C.grey,marginTop:4}}>{hint}</div>}
    </div>
  );
}

function Check({label,sub,checked,onChange}){
  return(
    <div onClick={onChange} style={{display:"flex",gap:10,alignItems:"flex-start",padding:"11px 13px",border:`1px solid ${checked?C.green:C.greyLight}`,borderRadius:9,cursor:"pointer",background:checked?C.greenPale:"#fff",transition:"all .15s"}}>

        {sub&&<div style={{fontSize:11,color:C.grey,lineHeight:1.5}}>{sub}</div>}
      </div>
    </div>
  );
}

function Card({children,style={}}){ return <div style={{background:"#fff",borderRadius:14,padding:22,border:"1px solid rgba(0,0,0,0.07)",boxShadow:"0 1px 8px rgba(0,0,0,0.04)",...style}}>{children}</div>; }

                  <div style={{fontFamily:"monospace",fontSize:19,fontWeight:800,color:C.navy}}>{payRef}</div>
                  <div style={{fontSize:10,color:C.grey,marginTop:6}}>SOKAPHYGITAL LTD · Barclays UK · Sort: XX-XX-XX · Acc: XXXXXXXX</div>
                  <div style={{fontSize:10,color:C.grey,marginTop:3}}>NGN: GTBank · SOKAPHYGITAL NG OPS · 0XXXXXXXXX</div>
                </div>
              )}
            </Card>
            <Card>
              <div style={{fontSize:12,fontWeight:700,color:C.navy,marginBottom:14}}>Payment Abstraction Layer</div>
              {[
                {ch:"Manual Bank Transfer (NGN)","st":"LIVE",n:"Reference-based. Admin confirms manually.",col:C.green},
                {ch:"Manual Bank Transfer (GBP/USD)","st":"LIVE",n:"UK account. Diaspora payments.",col:C.green},
                {ch:"Paystack","st":"READY TO CONNECT",n:"Nigerian cards, bank, USSD. API key required.",col:C.gold},
                {ch:"Flutterwave","st":"READY TO CONNECT",n:"Multi-African. Mobile money. API key required.",col:C.gold},
                {ch:"M-Pesa (Kenya)","st":"PHASE 2",n:"Kenya expansion.",col:C.grey},
                {ch:"Stripe","st":"EXCLUDED",n:"Excluded by SOKAPHYGITAL platform policy.",col:C.red},
              ].map(p=>(
                <div key={p.ch} style={{marginBottom:10,padding:"9px 11px",border:`1px solid ${C.greyLight}`,borderRadius:8}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                    <span style={{fontSize:11,fontWeight:600,color:C.navy}}>{p.ch}</span>
                    <span style={{fontSize:9,fontWeight:700,background:p.col+"18",color:p.col,borderRadius:4,padding:"2px 6px"}}>{p.st}</span>
                  </div>
                  <div style={{fontSize:10,color:C.grey}}>{p.n}</div>
                </div>
              ))}
            </Card>
          </div>
        )}

        {tab==="pipeline"&&(
          <Card>
            <div style={{fontSize:12,fontWeight:700,color:C.navy,marginBottom:14}}>Request Management Pipeline</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:10}}>
              {["NEW","REVIEWING","ACTION REQUIRED","CONNECTED","FOLLOW-UP","COMPLETED"].map((s,i)=>(
                <div key={s} style={{background:C.off,borderRadius:9,padding:13,border:`1px solid ${C.greyLight}`}}>
                  <div style={{fontSize:9,fontWeight:700,color:C.navy,letterSpacing:1,marginBottom:9}}>{s}</div>
                  <div style={{fontSize:22,fontWeight:800,color:C.grey,fontFamily:"monospace",marginBottom:3}}>0</div>
                  <div style={{fontSize:9,color:C.grey}}>requests</div>
                </div>
              ))}
            </div>
            <div style={{marginTop:18,padding:"11px 13px",background:C.goldPale,borderRadius:8,fontSize:11,color:C.grey,lineHeight:1.6}}>
              Pipeline requests will appear here as members submit LifeChecks, provider connection requests, care journey tickets, corporate enquiries, and diaspora family care requests.

          </Card>
        )}
      </div>
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────
function AHiiCare(){
  const [page,setPage]=useState("home");
  const [user,setUser]=useState(null);

  useEffect(()=>{
    dbGet("ahii_current_user").then(u=>{ if(u&&u.sokaId)setUser(u); });
  },[]);

  useEffect(()=>{
    if(user)dbSet("ahii_current_user",user);
  },[user]);

  const pages={
    home:<HomePage setPage={setPage}/>,
    how:<HowPage setPage={setPage}/>,
    register:<RegisterPage setPage={setPage} setUser={setUser}/>,
    login:<LoginPage setPage={setPage} setUser={setUser}/>,
    lifecheck:<LifeCheckPage user={user} setPage={setPage}/>,
    providers:<ProvidersPage/>,
    corporate:<CorporatePage/>,
    diaspora:<DiasporaPage/>,
    joinprovider:<JoinProviderPage/>,
    dashboard:<DashboardPage user={user} setPage={setPage}/>,
    admin:<AdminPage/>,
  };

  return(
    <div style={{fontFamily:"'Segoe UI',system-ui,sans-serif",minHeight:"100vh",background:C.off,color:C.text}}>
      <Nav page={page} setPage={setPage} user={user} setUser={setUser}/>
      {pages[page]||pages.home}
    </div>
  );
}


    // Mount the app
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(AHiiCare));

    // Hide loading screen
    setTimeout(() => {
      const l = document.getElementById('loading');
      if(l){ l.style.opacity='0'; setTimeout(()=>l.remove(), 500); }
    }, 1200);
  </script>
</body>
</html>
