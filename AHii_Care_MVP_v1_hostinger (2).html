<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0E1E4A;--gold:#B98A2E;--green:#2D8C45;--teal:#0E4D5C;--cream:#F5F2EB;--off:#FAFAF8;--grey:#6B7280;--light:#E5E7EB;--text:#1A1A2A;--dark:#080E1A}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--off);color:var(--text);min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-green{background:var(--green);color:#fff}
.btn-navy{background:var(--navy);color:#fff}
.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.8)}
.btn-outline{background:transparent;border:1px solid var(--light);color:var(--grey)}
.btn-lg{padding:13px 26px;font-size:15px}
.card{background:#fff;border-radius:13px;padding:22px;border:1px solid rgba(0,0,0,.07);box-shadow:0 1px 8px rgba(0,0,0,.04)}
.field{margin-bottom:0}
.field label{font-size:12px;font-weight:600;color:var(--navy);display:block;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--light);border-radius:7px;font-size:13px;font-family:inherit;color:var(--text);outline:none;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green)}
.muted{color:var(--grey);font-size:13px;line-height:1.7}
.tag{font-size:10px;font-weight:700;letter-spacing:2.5px;color:var(--gold);margin-bottom:8px;text-transform:uppercase}
.soka{font-family:monospace;font-size:20px;font-weight:800;color:var(--navy);letter-spacing:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
nav{background:var(--navy);position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3);padding:0 16px;display:flex;align-items:center;height:58px;gap:12px}
.nav-logo{display:flex;align-items:center;gap:9px;border:none;background:none;cursor:pointer}
.nav-icon{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--green),var(--gold));display:flex;align-items:center;justify-content:center;font-size:16px}
.nav-links{display:flex;gap:2px;flex:1;margin-left:6px;flex-wrap:wrap}
.nav-link{background:none;border:none;color:rgba(255,255,255,.5);font-size:12px;padding:5px 9px;border-radius:5px;cursor:pointer}
.nav-link:hover{color:rgba(255,255,255,.8)}
.nav-link.active{background:rgba(185,138,46,.15);color:#D4AF37;font-weight:600}
.nav-actions{display:flex;gap:7px;align-items:center}
#app{min-height:calc(100vh - 58px)}
.page{padding:40px 16px;max-width:1000px;margin:0 auto}
.page-sm{padding:40px 16px;max-width:520px;margin:0 auto}
.page-md{padding:40px 16px;max-width:700px;margin:0 auto}
.hero{background:var(--navy);padding:60px 16px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 55% 50% at 65% 45%,rgba(45,140,69,.06),transparent)}
.hero-inner{max-width:980px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center;position:relative;z-index:1}
.hero h1{color:#fff;font-size:clamp(26px,4vw,48px);font-weight:800;line-height:1.07;letter-spacing:-1.5px;margin-bottom:12px}
.hero p{color:rgba(255,255,255,.45);font-size:14px;line-height:1.8;max-width:420px;margin-bottom:24px}
.stats{display:flex;gap:20px;border-top:.5px solid rgba(255,255,255,.08);padding-top:18px;flex-wrap:wrap;margin-top:8px}
.stat-v{color:var(--gold);font-size:18px;font-weight:800;font-family:monospace}
.stat-l{color:rgba(255,255,255,.3);font-size:10px;line-height:1.4;margin-top:2px}
.passport{background:#1B2A5C;border:1px solid rgba(45,140,69,.22);border-radius:16px;padding:18px}
.passport-header{display:flex;align-items:center;gap:8px;margin-bottom:13px;padding-bottom:11px;border-bottom:.5px solid rgba(255,255,255,.06)}
.passport-icon{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,var(--green),var(--gold));display:flex;align-items:center;justify-content:center;font-size:12px}
.wi-ring{width:48px;height:48px;border-radius:50%;background:conic-gradient(var(--green) 85%,rgba(255,255,255,.07) 0);position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.wi-inner{position:absolute;inset:7px;border-radius:50%;background:#1B2A5C;display:flex;align-items:center;justify-content:center;color:var(--green);font-size:12px;font-weight:800}
.wi-bar-wrap{flex:1}
.wi-bar{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.wi-bar-track{flex:1;height:3px;background:rgba(255,255,255,.07);border-radius:2px}
.wi-bar-fill{height:100%;border-radius:2px}
.module-tag{background:rgba(45,140,69,.18);color:#7BCF9A;border:.5px solid rgba(45,140,69,.3);border-radius:4px;padding:2px 7px;font-size:9px;font-weight:600}
.tier-card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid rgba(0,0,0,.07);cursor:pointer;transition:all .15s}
.tier-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.09)}
.tier-card.selected{border:2px solid var(--gold)}
.tier-head{padding:16px 14px 12px}
.tier-body{padding:12px 14px}
.check-item{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border-radius:8px;cursor:pointer;transition:all .15s;border:1px solid var(--light)}
.check-item.on{background:#E8F5EC;border-color:var(--green)}
.check-box{width:17px;height:17px;border-radius:4px;border:2px solid var(--light);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .15s}
.check-box.on{background:var(--green);border-color:var(--green)}
.step-bar{display:flex;gap:3px;margin-bottom:20px}
.step-seg{flex:1;height:4px;border-radius:2px;background:var(--light);transition:background .3s}
.step-seg.done{background:var(--green)}
.pill{padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.pill-green{background:#DCFCE7;color:#166534}
.pill-blue{background:#DBEAFE;color:#1E40AF}
.pill-yellow{background:#FEF9C3;color:#92400E}
.pill-gray{background:#F3F4F6;color:#374151}
.success-circle{width:60px;height:60px;border-radius:50%;background:#E8F5EC;border:3px solid var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:28px}
.provider-card{background:#fff;border-radius:12px;padding:18px;border:1px solid rgba(0,0,0,.07);transition:all .2s}
.provider-card:hover{box-shadow:0 7px 22px rgba(0,0,0,.09);transform:translateY(-2px)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:#fff;border-radius:14px;padding:28px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:8px 10px;text-align:left;color:var(--grey);font-size:10px;letter-spacing:.5px;font-weight:600;border-bottom:1px solid var(--light);background:var(--off)}
td{padding:8px 10px;border-bottom:.5px solid var(--light);color:var(--text)}
.loading{position:fixed;inset:0;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity .5s}
.spinner{width:38px;height:38px;border:3px solid rgba(255,255,255,.1);border-top:3px solid var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:640px){.hero-inner{grid-template-columns:1fr}.passport{display:none}.grid2,.grid3,.grid4{grid-template-columns:1fr}.nav-links{display:none}}
</style>
</head>
